<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOTRAIL | Smart Explorer</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Outfit', sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100%; z-index: 0; }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
        }

        .feature-btn.active {
            background-color: rgba(5, 150, 105, 0.2); 
            border-color: #059669;
            color: white;
        }
        .feature-btn.active .circle-check { color: #10b981; opacity: 1; }

        .ecobot-btn-container {
            position: fixed; bottom: 2rem; right: 2rem; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
        }
        .ecobot-toggle {
            width: 4rem; height: 4rem; border-radius: 9999px;
            background-color: #102017; border: 1px solid #2d5a40;
            box-shadow: 0 0 20px rgba(45, 90, 64, 0.6);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s ease;
        }
        .ecobot-toggle:hover { background-color: #1a3626; transform: scale(1.05); }
        .ecobot-text { color: #88c498; font-weight: 900; letter-spacing: 0.2em; font-size: 0.875rem; }
    </style>
</head>
<body class="bg-slate-900">

    <div id="map" class="absolute inset-0"></div>

<nav class="absolute top-6 right-6 z-[1000] glass-panel rounded-full px-6 py-3 flex items-center gap-6 shadow-2xl">
        <a href="{% url 'home' %}" class="text-slate-300 hover:text-emerald-400 transition-colors text-xs font-bold uppercase tracking-widest flex items-center gap-2">
            <i class="fa-solid fa-house"></i> Home
        </a>
        <a href="{% url 'working' %}" class="text-slate-300 hover:text-emerald-400 transition-colors text-xs font-bold uppercase tracking-widest hidden md:block">
            Features
        </a>
        <a href="{% url 'ranking' %}" class="text-slate-300 hover:text-emerald-400 transition-colors text-xs font-bold uppercase tracking-widest hidden md:block">
            Leaderboard
        </a>
        <a href="{% url 'impact' %}" class="text-slate-300 hover:text-emerald-400 transition-colors text-xs font-bold uppercase tracking-widest hidden md:block">
            Impact
        </a>
        <a href="{% url 'sos' %}" class="text-red-400 hover:text-red-300 transition-colors text-xs font-bold uppercase tracking-widest flex items-center gap-2">
            <i class="fa-solid fa-triangle-exclamation"></i> SOS
        </a>
    </nav>

    <div class="ecobot-btn-container">
        <button id="ecobot-btn" onclick="togglePanel()" class="ecobot-toggle">
            <i class="fa-solid fa-leaf text-[#88c498] text-2xl"></i>
        </button>
        <span class="ecobot-text">ECOBOT</span>
    </div>

    <div id="control-panel" class="absolute top-6 left-6 z-[1000] w-80 glass-panel rounded-2xl shadow-2xl p-5 flex flex-col gap-5 translate-x-0 opacity-100">
        
        <div class="flex items-center justify-between border-b border-slate-700 pb-3">
            <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500 tracking-widest">ECOTRAIL</h1>
        </div>

        <div class="flex flex-col gap-2">
            <p class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Location</p>
            <div class="flex gap-2">
                <input type="text" id="location-search" placeholder="Search for Places" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                <button onclick="useMyLocation()" class="bg-slate-700 hover:bg-slate-600 border border-slate-600 text-white rounded-lg px-3 py-2 transition-colors">
                    <i class="fa-solid fa-location-crosshairs"></i>
                </button>
            </div>
        </div>

        <div class="flex flex-col gap-2">
            <p class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Select Feature Overlay</p>
            <div class="grid grid-cols-1 gap-2" id="feature-toggles">
                <button class="feature-btn active flex items-center justify-between bg-slate-800 border border-slate-600 rounded-lg px-4 py-2.5 text-sm text-slate-300 transition-all" data-feature="aqi" onclick="switchFeature('aqi', this)">
                    <span class="flex items-center gap-3"><i class="fa-solid fa-wind w-4"></i> Air Quality</span>
                    <i class="fa-solid fa-circle-check circle-check opacity-100 transition-opacity"></i>
                </button>
                <button class="feature-btn flex items-center justify-between bg-slate-800 border border-slate-600 rounded-lg px-4 py-2.5 text-sm text-slate-300 transition-all" data-feature="crowd" onclick="switchFeature('crowd', this)">
                    <span class="flex items-center gap-3"><i class="fa-solid fa-users w-4"></i> Crowd Density</span>
                    <i class="fa-solid fa-circle-check circle-check opacity-0 transition-opacity"></i>
                </button>
                <button class="feature-btn flex items-center justify-between bg-slate-800 border border-slate-600 rounded-lg px-4 py-2.5 text-sm text-slate-300 transition-all" data-feature="danger" onclick="switchFeature('danger', this)">
                    <span class="flex items-center gap-3"><i class="fa-solid fa-triangle-exclamation w-4"></i> Danger Zones</span>
                    <i class="fa-solid fa-circle-check circle-check opacity-0 transition-opacity"></i>
                </button>
            </div>
        </div>

        <div class="bg-slate-900/60 rounded-lg p-3 border border-slate-700 mt-2">
            <p class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider mb-2 text-center" id="legend-title">Air Quality Scale</p>
            <div class="flex justify-between items-center text-xs text-slate-300 px-2">
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-[#10b981] shadow-[0_0_8px_#10b981]"></span> Safe / Low</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-[#f59e0b] shadow-[0_0_8px_#f59e0b]"></span> Mod</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-[#ef4444] shadow-[0_0_8px_#ef4444]"></span> High</div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --------------------------------------------------------
        // 🔑 CREDENTIALS & CONSTANTS
        // --------------------------------------------------------
        const API_KEY = "0ca3a2820ab59bf6f9632e7a0b154f44"; // OpenWeather
        
        // ⚠️ IMPORTANT: Replace these with your actual Supabase details!
        const SUPABASE_URL = "https://tvmvzkqkjlkbwjpelhsy.supabase.co/rest/v1/api_hotelroom"; 
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2bXZ6a3FramxrYndqcGVsaHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwMjg2MDcsImV4cCI6MjA4OTYwNDYwN30.q8scZL1IZaPkY5yga3gm0cbvLCV3zwyuQQXzfboW18A";

        // Coordinates dictionary for Supabase data matching
        const locationCoords = {
            "Dharamshala": { lat: 32.2190, lng: 76.3234 },
            "Shimla": { lat: 31.1048, lng: 77.1734 }
        };

        // --------------------------------------------------------
        // 🗺️ MAP INITIALIZATION & UI LOGIC
        // --------------------------------------------------------
        const map = L.map('map', { zoomControl: false }).setView([32.2190, 76.3234], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            className: 'map-tiles'
        }).addTo(map);

        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        const layers = {
            aqi: L.layerGroup().addTo(map), // Default ON
            crowd: L.layerGroup(),
            danger: L.layerGroup()
        };

        let isPanelOpen = true;
        function togglePanel() {
            const panel = document.getElementById('control-panel');
            if (isPanelOpen) {
                panel.classList.remove('translate-x-0', 'opacity-100');
                panel.classList.add('-translate-x-[120%]', 'opacity-0');
            } else {
                panel.classList.remove('-translate-x-[120%]', 'opacity-0');
                panel.classList.add('translate-x-0', 'opacity-100');
            }
            isPanelOpen = !isPanelOpen;
        }

        function switchFeature(selectedFeature, btnElement) {
            document.querySelectorAll('.feature-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.querySelector('.circle-check').classList.replace('opacity-100', 'opacity-0');
            });

            btnElement.classList.add('active');
            btnElement.querySelector('.circle-check').classList.replace('opacity-0', 'opacity-100');

            const titles = { aqi: 'Air Quality Scale', crowd: 'Crowd Density Scale', danger: 'Danger Alert Level' };
            document.getElementById('legend-title').innerText = titles[selectedFeature];

            Object.keys(layers).forEach(key => map.removeLayer(layers[key]));
            map.addLayer(layers[selectedFeature]);
        }

        // --------------------------------------------------------
        // 1️⃣ AQI LOGIC (OpenWeather API)
        // --------------------------------------------------------
        async function fetchAndDrawAQI(lat, lng, placeName) {
            const url = `https://api.openweathermap.org/data/2.5/air_pollution?lat=${lat}&lon=${lng}&appid=${API_KEY}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                const aqiIndex = data.list[0].main.aqi; 

                let color = '#10b981', status = 'Safe';
                if (aqiIndex === 4) { color = '#f59e0b'; status = 'Moderate'; } 
                else if (aqiIndex === 5) { color = '#ef4444'; status = 'Hazardous'; }

                layers.aqi.clearLayers();
                L.circle([lat, lng], { color: color, fillColor: color, fillOpacity: 0.45, radius: 1200, weight: 2 }).bindPopup(`
                    <div style="font-family: 'Outfit', sans-serif;">
                        <b style="font-size: 1.1em;">${placeName}</b><br>
                        Air Quality: <b style="color:${color}">${status}</b> (Index: ${aqiIndex}/5)
                    </div>
                `).addTo(layers.aqi).openPopup();

                map.flyTo([lat, lng], 13, { duration: 1.5 });

                const aqiBtn = document.querySelector('[data-feature="aqi"]');
                if(!aqiBtn.classList.contains('active')) switchFeature('aqi', aqiBtn);
            } catch (error) {
                console.error("AQI Error:", error);
            }
        }

        // --------------------------------------------------------
        // 2️⃣ CROWD LOGIC (Supabase Database Integration)
        // --------------------------------------------------------
        async function fetchSupabaseCrowdData() {
            try {
                if(SUPABASE_URL.includes("YOUR_PROJECT_ID")) {
                    console.warn("Supabase not configured yet. Add your URL and Key.");
                    return;
                }

                const response = await fetch(`${SUPABASE_URL}?select=*`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                
                if (!response.ok) throw new Error("Supabase Fetch Failed");
                const hotels = await response.json();

                const crowdStats = {};
                hotels.forEach(hotel => {
                    const loc = hotel.location; 
                    if (!crowdStats[loc]) crowdStats[loc] = { total: 0, available: 0 };
                    crowdStats[loc].total += hotel.total_rooms;
                    crowdStats[loc].available += hotel.available_rooms;
                });

                layers.crowd.clearLayers();

                for (const [locationName, stats] of Object.entries(crowdStats)) {
                    if (stats.total === 0) continue; 

                    const bookedRooms = stats.total - stats.available;
                    const crowdPercentage = Math.round((bookedRooms / stats.total) * 100);

                    let color = '#10b981', statusText = 'Low Traffic';
                    if (crowdPercentage > 75) { color = '#ef4444'; statusText = 'Heavy Crowds'; } 
                    else if (crowdPercentage > 40) { color = '#f59e0b'; statusText = 'Moderate Crowds'; }

                    const coords = locationCoords[locationName];
                    if (coords) {
                        L.circle([coords.lat, coords.lng], { color: color, fillColor: color, fillOpacity: 0.5, radius: 1000 })
                        .bindPopup(`
                            <div style="font-family: 'Outfit', sans-serif;">
                                <b style="font-size: 1.1em;">${locationName}</b><br>
                                Crowd Level: <b style="color:${color}">${statusText}</b> (${crowdPercentage}%)<br>
                                <hr style="margin: 5px 0;">
                                <span style="font-size: 0.85em; color: #666;">Total Rooms: ${stats.total} | Available: ${stats.available}</span>
                            </div>
                        `).addTo(layers.crowd);
                    }
                }
            } catch (error) {
                console.error("Supabase Error:", error);
            }
        }

        // --------------------------------------------------------
        // 3️⃣ DANGER LOGIC 
        // --------------------------------------------------------
        const dangerData = [
            { name: "Shimla", lat: 31.1048, lng: 77.1734, hazard: "Earthquake, Landslides", risk: "High" },
            { name: "Kufri", lat: 31.1070, lng: 77.2962, hazard: "Landslides", risk: "High" },
            { name: "Manali", lat: 32.2432, lng: 77.1892, hazard: "Landslides, Floods", risk: "High" },
            { name: "Solang Valley", lat: 32.2719, lng: 77.1547, hazard: "Avalanches, Landslides", risk: "High" },
            { name: "Kullu Town", lat: 31.9566, lng: 77.0960, hazard: "Floods, Landslides", risk: "High" },
            { name: "Dharamshala", lat: 32.2190, lng: 76.3234, hazard: "Earthquake, Landslides", risk: "High" },
            { name: "McLeodGanj", lat: 32.2395, lng: 76.3153, hazard: "Earthquake Zones", risk: "High" },
            { name: "Mandi", lat: 31.7087, lng: 76.8790, hazard: "Landslides, Floods", risk: "High" },
            { name: "Rewalsar Lake", lat: 31.7815, lng: 76.7684, hazard: "Flood & Landslide risk", risk: "Moderate" },
            { name: "Kaza (Spiti)", lat: 32.2246, lng: 78.0715, hazard: "Avalanches, Snowstorms", risk: "High" },
            { name: "Kalpa (Kinnaur)", lat: 31.3423, lng: 77.6366, hazard: "Avalanches, Landslides", risk: "High" },
            { name: "Palampur", lat: 32.1109, lng: 76.5361, hazard: "Floods (river valleys)", risk: "Moderate" },
            { name: "Jogindernagar", lat: 31.8418, lng: 76.8376, hazard: "Landslides", risk: "High" },
            { name: "Balh Valley (Mandi)", lat: 31.6453, lng: 76.7564, hazard: "Landslides", risk: "High" },
            { name: "Jutogh (Shimla)", lat: 31.0740, lng: 77.1052, hazard: "Slope failure risk", risk: "Moderate" },
            { name: "Dagshai (Solan)", lat: 30.8648, lng: 77.0451, hazard: "Landslide risk", risk: "Moderate" },
            { name: "Sanarli-2 (Mandi)", lat: 31.7080, lng: 76.8603, hazard: "Landslide risk", risk: "Moderate" },
            { name: "Tattapani (Mandi)", lat: 31.7400, lng: 76.8610, hazard: "Landslide risk", risk: "Moderate" },
            { name: "Churah (Chamba)", lat: 32.6332, lng: 76.2440, hazard: "Floods & Landslides", risk: "High" },
            { name: "Bharmour (Chamba)", lat: 32.5500, lng: 76.3000, hazard: "Slope instability", risk: "High" },
            { name: "Sangla (Kinnaur)", lat: 31.5735, lng: 78.5614, hazard: "Landslides, Floods", risk: "High" },
            { name: "Reckong Peo (Kinnaur)", lat: 31.3696, lng: 78.1543, hazard: "Landslide risk", risk: "High" },
            { name: "Batal (Lahaul-Spiti)", lat: 32.8404, lng: 77.6377, hazard: "Avalanche", risk: "High" },
            { name: "Tabo (Spiti)", lat: 32.1186, lng: 78.0343, hazard: "High altitude hazards", risk: "Moderate" },
            { name: "Chitkul (Kinnaur)", lat: 31.3687, lng: 78.5445, hazard: "River flood risk", risk: "High" },
            { name: "Banjar (Kullu)", lat: 32.0286, lng: 77.0792, hazard: "Landslides", risk: "High" },
            { name: "Nirmand (Kullu)", lat: 31.9195, lng: 77.0957, hazard: "Flash flood", risk: "High" },
            { name: "Sainj (Kullu)", lat: 32.0100, lng: 77.0690, hazard: "Landslides, Flash floods", risk: "High" },
            { name: "Chamba Town", lat: 32.5510, lng: 76.0710, hazard: "Earthquake & Landslides", risk: "Moderate" },
            { name: "Una Town", lat: 31.4770, lng: 76.2690, hazard: "Moderate flood risk", risk: "Low" }
        ];

        function loadDangerData() {
            layers.danger.clearLayers(); 

            dangerData.forEach(spot => {
                // Universal Styling Logic
                let color = "#10b981"; // Low (Green)
                if (spot.risk === "High") color = "#ef4444"; // High (Red)
                else if (spot.risk === "Moderate") color = "#f59e0b"; // Moderate (Yellow)

                L.circle([spot.lat, spot.lng], {
                    color: color,
                    fillColor: color,
                    fillOpacity: 0.4,
                    radius: spot.risk === "High" ? 1800 : 1200, // Danger zones are larger/bold
                    weight: 2,
                    dashArray: spot.risk === "High" ? "5, 10" : "0" // Dashed line for High risk
                })
                .bindPopup(`
                    <div style="font-family: 'Outfit', sans-serif;">
                        <b style="font-size: 1.1em; color: ${color}">${spot.name}</b><br>
                        Disaster Risk: <b>${spot.risk}</b><br>
                        <hr style="margin: 5px 0; border-color: #eee;">
                        <span style="font-size: 0.9em; color: #444;">Hazards: ${spot.hazard}</span>
                    </div>
                `)
                .addTo(layers.danger);
            });
        }

        // --------------------------------------------------------
        // 📍 SEARCH & LOCATE LOGIC
        // --------------------------------------------------------
        document.getElementById('location-search').addEventListener("keypress", async function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                const query = this.value.trim();
                if (!query) return;

                const geoUrl = `https://api.openweathermap.org/geo/1.0/direct?q=${query}&limit=1&appid=${API_KEY}`;
                try {
                    const res = await fetch(geoUrl);
                    const geoData = await res.json();
                    
                    if (geoData.length > 0) {
                        // Switch back to AQI tab on new search
                        fetchAndDrawAQI(geoData[0].lat, geoData[0].lon, geoData[0].name);
                    } else {
                        alert("Location not found.");
                    }
                } catch (err) { console.error("Geocoding error:", err); }
            }
        });

        function useMyLocation() {
            const btn = document.querySelector('button[onclick="useMyLocation()"] i');
            btn.classList.replace('fa-location-crosshairs', 'fa-spinner');
            btn.classList.add('fa-spin');

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const lat = pos.coords.latitude, lng = pos.coords.longitude;
                        L.circleMarker([lat, lng], {radius: 8, color: '#fff', fillColor: '#3b82f6', fillOpacity: 1, weight: 3}).addTo(map).bindPopup("You are here!");
                        fetchAndDrawAQI(lat, lng, "Your Live Location");
                        btn.classList.remove('fa-spin'); btn.classList.replace('fa-spinner', 'fa-location-crosshairs');
                    },
                    (error) => {
                        alert("Please enable location permissions.");
                        btn.classList.remove('fa-spin'); btn.classList.replace('fa-spinner', 'fa-location-crosshairs');
                    }
                );
            }
        }

        // 🚀 BOOT SEQUENCE
        // 🚀 SMART BOOT SEQUENCE
        loadDangerData();
        fetchSupabaseCrowdData();

        // 1. Read the URL for coordinates
        const urlParams = new URLSearchParams(window.location.search);
        const targetLat = urlParams.get('lat');
        const targetLng = urlParams.get('lng');
        const targetLoc = urlParams.get('loc');

        // 2. Decide where to fly
        if (targetLat && targetLng && targetLoc) {
            // If they clicked the leaderboard, fly to that specific city!
            fetchAndDrawAQI(parseFloat(targetLat), parseFloat(targetLng), decodeURIComponent(targetLoc));
        } else {
            // If they just clicked the normal "Open Map" button, go to default
            fetchAndDrawAQI(23.1752, 77.2779, "kharpa");
        }
    </script>
</body>
</html>
